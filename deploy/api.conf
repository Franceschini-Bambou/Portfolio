# Apache : https://api.bambou-franceschini.fr → PocketBase (port interne 8090)
# À copier dans /etc/apache2/sites-available/api.conf
# certbot ajoutera tout seul la version HTTPS (api-le-ssl.conf).
<VirtualHost *:80>
    ServerName api.bambou-franceschini.fr
    DocumentRoot /var/www/html

    ProxyPreserveHost On
    ProxyRequests Off
    # laisse passer la vérification de certbot (certificat HTTPS)
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:8090/
    ProxyPassReverse / http://127.0.0.1:8090/

    ErrorLog ${APACHE_LOG_DIR}/canal-bf-api_error.log
    CustomLog ${APACHE_LOG_DIR}/canal-bf-api_access.log combined
</VirtualHost>
