# Apache : https://portfolio.bambou-franceschini.fr → le site (fichiers de dist/)
# À copier dans /etc/apache2/sites-available/portfolio.conf
# certbot ajoutera tout seul la version HTTPS (portfolio-le-ssl.conf).
<VirtualHost *:80>
    ServerName portfolio.bambou-franceschini.fr
    DocumentRoot /var/www/portfolio

    <Directory /var/www/portfolio>
        # le .htaccess du site gère la page 404 et le cache
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/portfolio_error.log
    CustomLog ${APACHE_LOG_DIR}/portfolio_access.log combined
</VirtualHost>
